<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLPP - Meal Logger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; background: white; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px 16px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3); }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .date-display { font-size: 12px; opacity: 0.8; margin-top: 8px; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .metric-card { background: #f5f7fa; padding: 12px; border-radius: 8px; border-left: 4px solid #667eea; }
        .metric-label { font-size: 12px; color: #666; margin-bottom: 6px; }
        .metric-value { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: #667eea; transition: width 0.3s ease; }
        .search-section { margin-bottom: 24px; }
        .search-input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; margin-bottom: 12px; transition: border-color 0.2s; }
        .search-input:focus { outline: none; border-color: #667eea; }
        .search-results { max-height: 320px; overflow-y: auto; background: #f9fafb; border-radius: 8px; margin-bottom: 12px; }
        .result-item { padding: 12px; border-bottom: 1px solid #e0e0e0; cursor: pointer; transition: background 0.2s; }
        .result-item:hover { background: #f0f0f0; }
        .result-name { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
        .result-nutrition { font-size: 12px; color: #666; }
        .no-results { padding: 16px; text-align: center; color: #999; font-size: 14px; }
        .quick-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 24px; }
        .quick-btn { padding: 12px; background: #f5f7fa; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; }
        .quick-btn:active { background: #667eea; color: white; border-color: #667eea; }
        .meals-section { margin-bottom: 24px; }
        .section-title { font-size: 14px; font-weight: 600; color: #667eea; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .meal-card { background: #f9fafb; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; border-left: 4px solid #667eea; }
        .meal-info { flex: 1; }
        .meal-name { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
        .meal-nutrition { font-size: 11px; color: #666; }
        .meal-delete { background: #fee; color: #c00; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 8px; }
        .meal-delete:hover { background: #fcc; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { width: 100%; background: white; padding: 20px; border-radius: 12px 12px 0 0; max-height: 80vh; overflow-y: auto; }
        .modal-close { float: right; background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .modal-close:hover { color: #333; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .form-group button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .form-group button:hover { opacity: 0.9; }
        .error-message { color: #c00; font-size: 12px; margin-top: 4px; }
        .serving-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
        .serving-option { padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; }
        .serving-option:hover { border-color: #667eea; background: #f9fafb; }
        .serving-option.selected { background: #667eea; color: white; border-color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ FLPP Meal Logger</h1>
            <p>Smart nutrition tracking with instant search</p>
            <div class="date-display" id="dateDisplay"></div>
        </div>
        <div class="metrics">
            <div class="metric-card">
                <div class="metric-label">Calories</div>
                <div class="metric-value" id="calorieValue">0</div>
                <div class="progress-bar"><div class="progress-fill" id="calorieProgress" style="width: 0%"></div></div>
                <div class="metric-label" style="margin-top: 4px; font-size: 11px; color: #999;" id="calorieTarget">Target: 2,500</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Protein</div>
                <div class="metric-value" id="proteinValue">0g</div>
                <div class="progress-bar"><div class="progress-fill" id="proteinProgress" style="width: 0%"></div></div>
                <div class="metric-label" style="margin-top: 4px; font-size: 11px; color: #999;" id="proteinTarget">Target: 170g</div>
            </div>
        </div>
        <div class="search-section">
            <input type="text" class="search-input" id="foodSearch" placeholder="🔍 Search foods (e.g., 'chicken', 'osso buco', 'pineapple')">
            <div class="search-results" id="searchResults" style="display: none;"></div>
        </div>
        <div class="quick-buttons" id="quickButtons"></div>
        <div class="meals-section">
            <div class="section-title">Today's Meals</div>
            <div id="mealsList" style="margin-bottom: 20px;"></div>
            <button class="quick-btn" style="width: 100%; grid-column: 1/-1;" onclick="openCustomMealModal()">+ Add Custom Meal</button>
        </div>
    </div>
    <div class="modal" id="customMealModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('customMealModal')">✕</button>
            <h2 style="margin-bottom: 20px;">Add Custom Meal</h2>
            <div class="form-group"><label>Meal Name</label><input type="text" id="customMealName" placeholder="e.g., Egg & Cheese Sandwich"></div>
            <div class="form-group"><label>Calories</label><input type="number" id="customCalories" placeholder="e.g., 350"></div>
            <div class="form-group"><label>Protein (g)</label><input type="number" id="customProtein" placeholder="e.g., 18"></div>
            <div class="form-group"><label>Carbs (g)</label><input type="number" id="customCarbs" placeholder="e.g., 35"></div>
            <div class="form-group"><label>Fat (g)</label><input type="number" id="customFat" placeholder="e.g., 12"></div>
            <div class="form-group"><label>Notes (optional)</label><input type="text" id="customNotes" placeholder="e.g., homemade from Publix ingredients"></div>
            <div class="form-group"><button onclick="saveCustomMeal()">Log Meal</button><div class="error-message" id="customMealError"></div></div>
        </div>
    </div>
    <div class="modal" id="servingSizeModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('servingSizeModal')">✕</button>
            <h2 style="margin-bottom: 20px;" id="servingSizeTitle">Select Serving Size</h2>
            <div id="servingSizeOptions"></div>
            <div class="form-group" style="margin-top: 20px;"><button onclick="confirmServingSize()">Confirm</button></div>
        </div>
    </div>

            { name: "String Cheese (1 stick)", calories: 80, protein: 7, carbs: 1, fat: 6, category: "dairy" },
            { name: "Beef Stick (1 stick)", calories: 80, protein: 7, carbs: 0, fat: 6, category: "snack" },
            { name: "Pretzels (1 oz)", calories: 108, protein: 3, carbs: 23, fat: 1, category: "snack" },
            { name: "Popcorn - Air Popped (3 cups)", calories: 93, protein: 3, carbs: 19, fat: 1, category: "snack" },
            { name: "Dark Chocolate - 70% Cacao (1 oz)", calories: 170, protein: 3, carbs: 13, fat: 12, category: "snack" },
            { name: "Goji Berries (2 tbsp)", calories: 80, protein: 3, carbs: 15, fat: 0.5, category: "snack" },
            { name: "Publix - Precut Pineapple Spears (1 cup)", calories: 82, protein: 1, carbs: 22, fat: 0.3, category: "fruit" },
            { name: "Publix - Precut Mango Chunks (1 cup)", calories: 99, protein: 1.4, carbs: 25, fat: 0.6, category: "fruit" },
            { name: "Publix - Precut Watermelon (1 cup cubes)", calories: 46, protein: 0.9, carbs: 12, fat: 0.2, category: "fruit" },
            { name: "Publix - Mixed Berry Container (1 cup)", calories: 85, protein: 1.5, carbs: 21, fat: 0.5, category: "fruit" },
            { name: "Publix - Melon Medley (1 cup)", calories: 65, protein: 1, carbs: 16, fat: 0.4, category: "fruit" },
            { name: "Publix - Precut Cantaloupe (1 cup)", calories: 54, protein: 1.3, carbs: 13, fat: 0.4, category: "fruit" },
            { name: "Publix - Precut Honeydew (1 cup)", calories: 64, protein: 1, carbs: 16, fat: 0.3, category: "fruit" },
            { name: "Publix - Precut Grapes (1 cup)", calories: 104, protein: 1, carbs: 27, fat: 0.2, category: "fruit" },
            { name: "Publix - Precut Strawberries (1 container)", calories: 49, protein: 1, carbs: 12, fat: 0.5, category: "fruit" },
            { name: "Publix - Precut Blueberries (1 container)", calories: 85, protein: 1, carbs: 21, fat: 0.5, category: "fruit" },
            { name: "Publix - Precut Raspberries (1 container)", calories: 64, protein: 1.5, carbs: 15, fat: 0.8, category: "fruit" },
            { name: "Publix - Precut Pineapple & Mango Mix (1 cup)", calories: 90, protein: 1.2, carbs: 23, fat: 0.5, category: "fruit" },
            { name: "Publix - Precut Fruit Medley (1 cup)", calories: 80, protein: 1, carbs: 21, fat: 0.3, category: "fruit" }
        ];

        let appState = {
            meals: [],
            metrics: { calories: 0, protein: 0, carbs: 0, fat: 0 },
            searchResults: [],
            selectedFood: null,
            selectedServingSize: null,
            currentDate: new Date().toISOString().split('T')[0],
            fuseSearch: null
        };

        function init() {
            updateDateDisplay();
            setupFuzzySearch();
            checkAndResetForNewDay();
            loadDailyData();
            renderMeals();
            renderQuickButtons();
            setupSearch();
        }

        function checkAndResetForNewDay() {
            const storedDate = localStorage.getItem('flpp_last_date');
            const today = appState.currentDate;
            
            if (storedDate && storedDate !== today) {
                localStorage.removeItem(`flpp_meals_${storedDate}`);
            }
            
            localStorage.setItem('flpp_last_date', today);
        }

        function setupFuzzySearch() {
            const options = { keys: ['name'], threshold: 0.4, ignoreLocation: true, minMatchCharLength: 2 };
            appState.fuseSearch = new Fuse(FOOD_DATABASE, options);
        }

        function updateDateDisplay() {
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            const dateStr = new Date().toLocaleDateString('en-US', options);
            document.getElementById('dateDisplay').textContent = dateStr;
        }

        function loadDailyData() {
            const key = `flpp_meals_${appState.currentDate}`;
            const saved = localStorage.getItem(key);
            if (saved) {
                appState.meals = JSON.parse(saved);
                calculateMetrics();
            }
        }

        function saveDailyData() {
            const key = `flpp_meals_${appState.currentDate}`;
            localStorage.setItem(key, JSON.stringify(appState.meals));
        }

        function calculateMetrics() {
            appState.metrics = { calories: 0, protein: 0, carbs: 0, fat: 0 };
            appState.meals.forEach(meal => {
                appState.metrics.calories += meal.calories || 0;
                appState.metrics.protein += meal.protein || 0;
                appState.metrics.carbs += meal.carbs || 0;
                appState.metrics.fat += meal.fat || 0;
            });
            updateProgress();
        }

        function updateProgress() {
            const targets = { calories: 2500, protein: 170 };
            document.getElementById('calorieValue').textContent = Math.round(appState.metrics.calories);
            document.getElementById('calorieProgress').style.width = Math.min(100, (appState.metrics.calories / targets.calories) * 100) + '%';
            document.getElementById('proteinValue').textContent = Math.round(appState.metrics.protein) + 'g';
            document.getElementById('proteinProgress').style.width = Math.min(100, (appState.metrics.protein / targets.protein) * 100) + '%';
            const calorieRemaining = targets.calories - appState.metrics.calories;
            const proteinRemaining = targets.protein - appState.metrics.protein;
            document.getElementById('calorieTarget').textContent = `${calorieRemaining} left`;
            document.getElementById('proteinTarget').textContent = `${Math.max(0, proteinRemaining)}g left`;
        }

        function renderQuickButtons() {
            const container = document.getElementById('quickButtons');
            container.innerHTML = '';
            const restaurants = ["Bonos BBQ", "LongHorn", "Panera", "Chick-fil-A", "Olive Garden", "Darumas", "Salsas", "Rice Bowl", "Arby's", "Miller's", "Bagels R Us", "Tropical Smoothie"];
            restaurants.forEach(rest => {
                const btn = document.createElement('button');
                btn.className = 'quick-btn';
                btn.textContent = rest;
                btn.onclick = () => searchForRestaurant(rest);
                container.appendChild(btn);
            });
        }

        function searchForRestaurant(restaurantName) {
            const results = FOOD_DATABASE.filter(f => f.name.toLowerCase().includes(restaurantName.toLowerCase()));
            displaySearchResults(results);
        }

        function setupSearch() {
            const searchInput = document.getElementById('foodSearch');
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                if (!query) {
                    document.getElementById('searchResults').style.display = 'none';
                    return;
                }
                searchTimeout = setTimeout(() => { performSearch(query); }, 200);
            });
        }

        function performSearch(query) {
            const results = appState.fuseSearch.search(query).map(result => result.item);
            appState.searchResults = results.length > 0 ? results : [];
            displaySearchResults(appState.searchResults);
        }

        function displaySearchResults(results) {
            const resultsDiv = document.getElementById('searchResults');
            if (results.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No results found. Try "+ Add Custom Meal" to log anyway.</div>';
                resultsDiv.style.display = 'block';
                return;
            }
            resultsDiv.innerHTML = results.slice(0, 10).map((result, idx) => `
                <div class="result-item" onclick="selectFood(${FOOD_DATABASE.indexOf(result)})">
                    <div class="result-name">${result.name}</div>
                    <div class="result-nutrition">${result.calories} cal | ${result.protein}g protein | ${result.carbs}g carbs | ${result.fat}g fat</div>
                </div>
            `).join('');
            resultsDiv.style.display = 'block';
        }

        function selectFood(idx) {
            appState.selectedFood = FOOD_DATABASE[idx];
            if (appState.selectedFood.servingNote) {
                showServingSizeModal();
            } else {
                logMeal(appState.selectedFood);
            }
        }

        function showServingSizeModal() {
            const food = appState.selectedFood;
            document.getElementById('servingSizeTitle').textContent = `${food.name}`;
            const options = document.getElementById('servingSizeOptions');
            options.innerHTML = `
                <p style="margin-bottom: 16px; font-size: 14px;">This is a packaged item. How much did you eat?</p>
                <div class="serving-options">
                    <div class="serving-option" onclick="selectServing(0.25)">1/4 package</div>
                    <div class="serving-option" onclick="selectServing(0.5)">1/2 package</div>
                    <div class="serving-option" onclick="selectServing(0.75)">3/4 package</div>
                    <div class="serving-option" onclick="selectServing(1)">Full package</div>
                </div>
            `;
            document.getElementById('servingSizeModal').classList.add('active');
        }

        function selectServing(fraction) {
            appState.selectedServingSize = fraction;
            const options = document.querySelectorAll('.serving-option');
            options.forEach(opt => opt.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function confirmServingSize() {
            if (!appState.selectedServingSize) {
                alert('Please select a serving size');
                return;
            }
            const food = { ...appState.selectedFood };
            food.calories = Math.round(food.calories * appState.selectedServingSize);
            food.protein = Math.round(food.protein * appState.selectedServingSize);
            food.carbs = Math.round(food.carbs * appState.selectedServingSize);
            food.fat = Math.round(food.fat * appState.selectedServingSize);
            food.notes = `${Math.round(appState.selectedServingSize * 100)}% of package`;
            logMeal(food);
            closeModal('servingSizeModal');
            appState.selectedServingSize = null;
        }

        function logMeal(meal) {
            appState.meals.push({
                ...meal,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            calculateMetrics();
            saveDailyData();
            renderMeals();
            document.getElementById('foodSearch').value = '';
            document.getElementById('searchResults').style.display = 'none';
        }

        function deleteMeal(idx) {
            appState.meals.splice(idx, 1);
            calculateMetrics();
            saveDailyData();
            renderMeals();
        }

        function renderMeals() {
            const container = document.getElementById('mealsList');
            if (appState.meals.length === 0) {
                container.innerHTML = '<p style="color: #999; font-size: 13px; text-align: center; padding: 20px;">No meals logged yet. Search above or click a restaurant!</p>';
                return;
            }
            container.innerHTML = appState.meals.map((meal, idx) => `
                <div class="meal-card">
                    <div class="meal-info">
                        <div class="meal-name">${meal.name}</div>
                        <div class="meal-nutrition">
                            ${meal.calories} cal | ${meal.protein}g protein | ${meal.timestamp}
                            ${meal.notes ? `<br><small>📝 ${meal.notes}</small>` : ''}
                        </div>
                    </div>
                    <button class="meal-delete" onclick="deleteMeal(${idx})">Delete</button>
                </div>
            `).join('');
        }

        function openCustomMealModal() {
            document.getElementById('customMealModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveCustomMeal() {
            const name = document.getElementById('customMealName').value.trim();
            const calories = parseFloat(document.getElementById('customCalories').value) || 0;
            const protein = parseFloat(document.getElementById('customProtein').value) || 0;
            const carbs = parseFloat(document.getElementById('customCarbs').value) || 0;
            const fat = parseFloat(document.getElementById('customFat').value) || 0;
            const notes = document.getElementById('customNotes').value.trim();
            if (!name || !calories) {
                document.getElementById('customMealError').textContent = 'Please enter meal name and calories';
                return;
            }
            logMeal({ name, calories, protein, carbs, fat, notes });
            document.getElementById('customMealName').value = '';
            document.getElementById('customCalories').value = '';
            document.getElementById('customProtein').value = '';
            document.getElementById('customCarbs').value = '';
            document.getElementById('customFat').value = '';
            document.getElementById('customNotes').value = '';
            document.getElementById('customMealError').textContent = '';
            closeModal('customMealModal');
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });

        init();
    </script>
</body>
</html>
